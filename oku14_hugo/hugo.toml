baseURL = "/oku14/"
languageCode = "zh-tw"
title = "OKU 14 骨科筆記"
theme = "PaperMod"

# Hugo ignores "_"-prefixed content files by default, so partial/working
# files under content/oku14/ are already excluded from the build. An
# ignoreFiles regex used to live here; it matched nothing useful and the same
# pattern broke the home page in oku14_site by also matching _index.md.

[frontmatter]
date = ["date", "publishDate", "lastmod"]

[params]
env = "production"
defaultTheme = "system"
ShowReadingTime = true
ShowToc = true
TocOpen = true
ShowBreadCrumbs = true
ShowWordCount = true
ShowProgressBar = true
summaryLength = 30
description = "Orthopaedic Knowledge Update 14 結構化中文筆記"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首頁"
    url = "/"
    weight = 5
  [[menu.main]]
    identifier = "oku14"
    name = "OKU 14"
    url = "/oku14/"
    weight = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]
